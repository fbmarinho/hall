<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spreadsheet Loader</title>
    <style>
      #drop-zone {
        border: 2px dashed #888;
        border-radius: 8px;
        padding: 3rem;
        text-align: center;
      }

      #drop-zone.dragover {
        background: #eef5ff;
        border-color: #2672d8;
      }
    </style>
  </head>
  <body>
    <div id="drop-zone">
      <p>Drop an Excel file here</p>
      <button id="choose-file" type="button">Choose file</button>
      <input id="file-input" type="file" accept=".xlsx,.xls,.csv" hidden />
    </div>

    <p id="status"></p>
    <pre id="output"></pre>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="./dist/index.js"></script>
  </body>
</html>
