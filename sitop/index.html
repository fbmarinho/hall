<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Consulta SITOP</title>
  </head>

  <body>
    <h2>Login SITOP</h2>

    <label>
      Usuário:
      <input type="text" id="usuario" />
    </label>

    <br /><br />

    <label>
      Senha:
      <input type="password" id="senha" />
    </label>

    <br /><br />

    <button onclick="executar()">Consultar SITOP</button>

    <h3>Resultado:</h3>

    <pre id="resultado"></pre>

    <script>
      async function consultarSITOP(usuario, senha) {
        console.log("Iniciando login...");

        // ==========================================
        // LOGIN
        // ==========================================

        const login = await fetch(
          "https://csdpocos.petrobras.com.br/api/login",
          {
            method: "POST",
            mode: "cors",

            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },

            body: JSON.stringify({
              user: usuario,
              password: senha,
            }),
          },
        );

        console.log("HTTP Login:", login.status);

        if (!login.ok) {
          throw new Error(`Erro no login: HTTP ${login.status}`);
        }

        const loginJson = await login.json();

        console.log("Resposta Login:", loginJson);

        // Token diretamente do JSON
        const token = loginJson.token;

        if (!token) {
          throw new Error("Token não encontrado na resposta do login.");
        }

        console.log("Token obtido com sucesso.");

        // ==========================================
        // CONSULTA SITOP
        // ==========================================

        console.log("Consultando SITOP...");

        const response = await fetch(
          "https://csdpocos.petrobras.com.br/holistico/api/octopus/sitop/",
          {
            method: "GET",
            mode: "cors",

            headers: {
              Accept: "application/json",
              Authorization: `Bearer ${token}`,
              App: "holistico",
            },
          },
        );

        console.log("HTTP SITOP:", response.status);

        if (!response.ok) {
          throw new Error(`Erro SITOP: HTTP ${response.status}`);
        }

        const json = await response.json();

        console.log("Resposta SITOP:", json);

        return json;
      }

      // ==========================================
      // EXECUTAR
      // ==========================================

      async function executar() {
        const usuario = document.getElementById("usuario").value;

        const senha = document.getElementById("senha").value;

        const resultado = document.getElementById("resultado");

        resultado.textContent = "Consultando...";

        try {
          const dados = await consultarSITOP(usuario, senha);

          resultado.textContent = JSON.stringify(dados, null, 2);
        } catch (erro) {
          console.error("ERRO:", erro);

          resultado.textContent = "Erro: " + erro.message;
        }
      }
    </script>
  </body>
</html>
